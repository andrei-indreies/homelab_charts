{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: insecure-requests
  namespace: {{ .Values.ingress.namespace }}
spec:
  headers:
    contentSecurityPolicy: "upgrade-insecure-requests"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "nextcloud-app.fullname" . }}
  namespace: {{ .Values.ingress.namespace }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - kind: Service
          name: {{ include "nextcloud-app.fullname" . }}
          namespace: {{ .Values.ingress.namespace }}
          port: {{ .Values.service.port }}
          passHostHeader: true
      middlewares:
        - name: insecure-requests
          namespace: {{ .Values.ingress.namespace }}
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
{{- end }}