apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: organizr
  namespace: {{ .Values.namespace | default "main" }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.domain }}`)
      kind: Rule
      services:
        - kind: Service
          name: organizr-web
          namespace: {{ .Values.namespace | default "main" }}
          port: 80
          passHostHeader: true
    - match: Host(`www.{{ .Values.domain }}`)
      kind: Rule
      middlewares:
        - name: organizr-redirect-to-non-www
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: organizr-redirect-to-non-www
  namespace: {{ .Values.namespace | default "main" }}
spec:
  redirectRegex:
    regex: ^https://www\.{{ .Values.domain }}(.*)
    replacement: https://{{ .Values.domain }}$1
    permanent: true
