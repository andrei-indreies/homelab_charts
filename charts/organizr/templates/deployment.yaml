apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nameOverride | default "organizr" }}
  labels:
    app: organizr
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: organizr
  template:
    metadata:
      labels:
        app: organizr
    spec:
      containers:
        - name: organizr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: "{{ .Values.env.timezone }}"
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: organizr-config
